name: macOS app

# Builds the native Twincxt for macOS (Swift, AppKit, WKWebView; macos/) on
# GitHub's Mac: one universal app for Apple Silicon and Intel, as a .dmg (to
# install) and a .zip (used by the built-in updater). On a version tag the
# files are attached to that release; the Windows installer is added from the
# owner's PC.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Attach the files to this release (a version tag, e.g. v1.2.0); empty: don't"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Build .dmg and .zip (universal)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "VERSION is $v but the tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Build
        run: |
          xcrun swiftc --version
          bash macos/build.sh

      # Twincxt 1.2.0 (Electron) updates itself from ...-mac-arm64.zip or
      # ...-mac-x64.zip; the universal zip under those names moves it to this app.
      - name: Files for older versions' updater
        run: |
          cd build/mac
          v="$(tr -d '[:space:]' < ../../VERSION)"
          cp "Twincxt-$v-mac.zip" "Twincxt-$v-mac-arm64.zip"
          cp "Twincxt-$v-mac.zip" "Twincxt-$v-mac-x64.zip"

      - name: Look at the app
        run: |
          app=build/mac/Twincxt.app
          codesign --verify --deep --strict "$app" && echo "signature ok"
          lipo -info "$app/Contents/MacOS/Twincxt"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$app/Contents/Info.plist"
          du -sh "$app"
          ls -la build/mac

      - name: Start it
        run: |
          app=build/mac/Twincxt.app
          export TWINCXT_SMOKE=40 TWINCXT_DEBUG=1 TWINCXT_USERDATA="$RUNNER_TEMP/twincxt-data"
          export TWINCXT_SMOKE_SHOT="$PWD/mac-window.png"
          "$app/Contents/MacOS/Twincxt" > app.log 2>&1 &
          pid=$!
          sleep 30
          screencapture -x mac-screen.png || true
          for i in $(seq 1 60); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          echo "--- app output"; tail -n 80 app.log || true
          ls -la mac-*.png || true

      # Dark theme, and a WhatsApp call window opened and closed the way its
      # close button would (the call is handed back through "Move here").
      - name: Start it (dark, call window)
        run: |
          app=build/mac/Twincxt.app
          data="$RUNNER_TEMP/twincxt-dark"
          mkdir -p "$data"
          echo '{"theme":"dark","blurNames":true}' > "$data/config.json"
          export TWINCXT_SMOKE=30 TWINCXT_DEBUG=1 TWINCXT_USERDATA="$data" TWINCXT_TEST_POPUP=1
          export TWINCXT_SMOKE_SHOT="$PWD/mac-dark.png"
          "$app/Contents/MacOS/Twincxt" > app-dark.log 2>&1 &
          pid=$!
          for i in $(seq 1 70); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          cat app-dark.log || true
          grep -q "test: popups open = 1" app-dark.log && grep -q "test: popups after close = 0" app-dark.log && echo "call window ok"

      - name: Checksums
        run: |
          cd build/mac
          shasum -a 256 Twincxt-*.dmg Twincxt-*.zip > SHA256SUMS-mac.txt
          cat SHA256SUMS-mac.txt

      - name: Upload the files
        uses: actions/upload-artifact@v4
        with:
          name: Twincxt-macOS
          path: |
            build/mac/Twincxt-*.dmg
            build/mac/Twincxt-*.zip
            build/mac/SHA256SUMS-mac.txt
          if-no-files-found: error

      - name: Upload the check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Twincxt-macOS-check
          path: |
            mac-*.png
            app*.log
          if-no-files-found: ignore

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          tag="${RELEASE:-$GITHUB_REF_NAME}"
          case "$tag" in v[0-9]*) ;; *) echo "Not a version tag: $tag"; exit 1 ;; esac
          gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Twincxt ${tag#v}" --notes "" || true
          gh release upload "$tag" build/mac/Twincxt-*.dmg build/mac/Twincxt-*.zip build/mac/SHA256SUMS-mac.txt -R "$GITHUB_REPOSITORY" --clobber
