name: Linux app

# Builds Twincxt for Linux (x86_64): a .deb for Debian, Ubuntu and Mint, and an
# AppImage for other distributions. Built on the older Ubuntu so the .deb's
# dependencies have names both older and newer releases know. On a version tag
# the files are attached to that release.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Attach the files to this release (a version tag, e.g. v1.2.0); empty: don't"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build .deb and AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="v$(node -p "require('./desktop/package.json').version")"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "desktop/package.json is $v but the tag is $GITHUB_REF_NAME"; exit 1; }

      # The runner usually has these already; apt runs only for what is missing,
      # retried on Ubuntu's own archive because the default mirror is sometimes
      # unreachable from GitHub (as on Sonara's builds).
      - name: Test tools
        timeout-minutes: 15
        run: |
          missing() { for p in "$@"; do dpkg -s "$p" >/dev/null 2>&1 || echo "$p"; done; }
          need=$(missing xvfb imagemagick)
          [ -z "$need" ] && exit 0
          for attempt in 1 2 3 4; do
            sudo timeout 150 apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=10 &&
              sudo timeout 150 apt-get install -y -o Acquire::Retries=1 $need && exit 0
            echo "Ubuntu's mirror didn't answer (try $attempt); trying Ubuntu's own archive"
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            sleep 20
          done
          exit 1

      - name: Install
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: desktop
        run: npm run dist:linux

      - name: Look inside the .deb
        run: |
          deb=$(ls desktop/dist/Twincxt-*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -E "\.desktop|bin/twincxt|chrome-sandbox|icons/hicolor/256" || true
          ls -la desktop/dist

      - name: Start it
        run: |
          chmod +x desktop/dist/Twincxt-*.AppImage
          export TWINCXT_SMOKE=40 TWINCXT_DEBUG=1 TWINCXT_USERDATA="$RUNNER_TEMP/twincxt-data" APPIMAGE_EXTRACT_AND_RUN=1
          # The test runs without the Chromium sandbox (CI containers do not allow it);
          # installed from the .deb, Twincxt uses the sandbox.
          xvfb-run -a -s "-screen 0 1440x900x24" bash -c '
            "$(ls desktop/dist/Twincxt-*.AppImage)" --no-sandbox > app.log 2>&1 &
            sleep 30
            import -window root linux-window.png
            wait || true
          '
          echo "--- app output"; tail -n 40 app.log || true
          echo "--- debug log"; cat "$RUNNER_TEMP/twincxt-data/debug.log" || true

      - name: Checksums
        run: |
          cd desktop/dist
          sha256sum Twincxt-*.AppImage Twincxt-*.deb > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Upload the files
        uses: actions/upload-artifact@v4
        with:
          name: Twincxt-Linux
          path: |
            desktop/dist/Twincxt-*.AppImage
            desktop/dist/Twincxt-*.deb
            desktop/dist/SHA256SUMS-linux.txt
          if-no-files-found: error

      - name: Upload the check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Twincxt-Linux-check
          path: |
            linux-window.png
            app.log
          if-no-files-found: ignore

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          tag="${RELEASE:-$GITHUB_REF_NAME}"
          case "$tag" in v[0-9]*) ;; *) echo "Not a version tag: $tag"; exit 1 ;; esac
          gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Twincxt ${tag#v}" --notes "" || true
          gh release upload "$tag" desktop/dist/Twincxt-*.AppImage desktop/dist/Twincxt-*.deb desktop/dist/SHA256SUMS-linux.txt -R "$GITHUB_REPOSITORY" --clobber
