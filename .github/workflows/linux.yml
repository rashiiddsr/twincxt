name: Linux app

# Builds the native Linux Twincxt (C, GTK 3 + the system's WebKitGTK 4.1, in
# linux/): a .deb for Debian, Ubuntu and Mint, and an AppImage for other
# distributions. Built on the older Ubuntu so it runs on older glibc too; the
# .deb is also installed and started on Ubuntu 24.04. On a version tag the files
# are attached to that release.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Attach the files to this release (a version tag, e.g. v1.2.0); empty: don't"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Retried on Ubuntu's own archive: the default mirror is sometimes unreachable
  # from GitHub (as on Sonara's builds).
  APT_RETRY: |
    apt_install() {
      rec=--no-install-recommends
      [ -n "$RECOMMENDS" ] && rec=--install-recommends
      for attempt in 1 2 3 4; do
        sudo timeout 300 apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=10 &&
          sudo timeout 900 apt-get install -y $rec -o Acquire::Retries=1 "$@" && return 0
        echo "Ubuntu's mirror didn't answer (try $attempt); trying Ubuntu's own archive"
        sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
          /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
        sleep 20
      done
      return 1
    }

jobs:
  linux:
    name: Build .deb and AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "VERSION is $v but the tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Packages
        timeout-minutes: 20
        run: |
          eval "$APT_RETRY"
          # Build: GTK 3, WebKitGTK 4.1, libsoup 3. Test: X server, D-Bus, the
          # media plugins and tray library the .deb recommends, GNOME's font.
          apt_install build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            imagemagick desktop-file-utils xvfb dbus dbus-x11 fonts-cantarell \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-nice \
            gstreamer1.0-pipewire libayatana-appindicator3-1
          pkg-config --modversion webkit2gtk-4.1 libsoup-3.0 gtk+-3.0

      - name: Build
        run: make -C linux

      - name: Self-test (PIN hash, version compare)
        run: TWINCXT_SELFTEST=1 linux/build/twincxt

      - name: Package
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          export APPIMAGE_EXTRACT_AND_RUN=1 APPIMAGETOOL="$RUNNER_TEMP/appimagetool"
          desktop-file-validate linux/io.github.rashiiddsr.Twincxt.desktop
          linux/package.sh

      - name: Look inside the .deb
        run: |
          deb=$(ls linux/dist/Twincxt-*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          ldd linux/build/twincxt | sort
          objdump -T linux/build/twincxt | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1

      - name: Install the .deb
        run: |
          eval "$APT_RETRY"
          apt_install "./$(ls linux/dist/Twincxt-*.deb)"
          twincxt --version

      - name: Start it
        run: |
          mkdir -p check
          export TWINCXT_SMOKE=40 TWINCXT_DEBUG=1 TWINCXT_USERDATA="$RUNNER_TEMP/twincxt-data" \
            TWINCXT_SMOKE_SHOT="$PWD/check/linux-window.png" TWINCXT_UPDATE_DELAY=600
          timeout 150 xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- bash -c '
            twincxt > check/app.log 2>&1 &
            sleep 35
            import -window root check/linux-screen.png
            wait
          ' || echo "exit code $?"
          cp "$RUNNER_TEMP/twincxt-data/debug.log" check/debug.log || true
          echo "--- WebRTC and page check"; grep '^SMOKE' check/app.log || true
          echo "--- app output"; tail -n 60 check/app.log || true
          grep -q '^SMOKE done' check/app.log
          grep -q 'shell: {"type":"ready"' check/debug.log

      - name: App lock (starts locked with PIN 1234, tries 0000, then 1234)
        run: |
          data="$RUNNER_TEMP/twincxt-lock"
          mkdir -p "$data"
          echo '{"lockEnabled": true, "lockAfter": 5,
            "lockSalt": "00112233445566778899aabbccddeeff",
            "lockHash": "98cd56f19733a361768b76706415776c6f3e161aef907b7e88c5ea3fe5639ab7"}' > "$data/config.json"
          export TWINCXT_SMOKE=20 TWINCXT_DEBUG=1 TWINCXT_USERDATA="$data" \
            TWINCXT_SMOKE_SHOT="$PWD/check/lock.png" TWINCXT_UPDATE_DELAY=600
          timeout 120 xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- twincxt > check/lock.log 2>&1 || echo "exit code $?"
          grep '^SMOKE lock' check/lock.log || true
          grep 'lock:' "$data/debug.log" | tee check/lock-debug.log
          grep -q 'lock: unlock refused: Wrong PIN.' check/lock-debug.log
          grep -q 'lock: unlock ok' check/lock-debug.log
          grep -q '^SMOKE lock: unlocked' check/lock.log
          grep -q '"lockFails": 0' "$data/config.json"

      - name: Updater check (pretends to be 1.0.0, downloads and verifies the latest release)
        run: |
          export TWINCXT_SMOKE=60 TWINCXT_DEBUG=1 TWINCXT_USERDATA="$RUNNER_TEMP/twincxt-upd" \
            TWINCXT_TEST_VERSION=1.0.0 TWINCXT_UPDATE_DELAY=3
          timeout 150 xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- twincxt > check/updater.log 2>&1 || true
          grep 'update:' "$RUNNER_TEMP/twincxt-upd/debug.log" | tee check/updater-debug.log
          grep -q 'downloaded and verified' check/updater-debug.log

      - name: Start the AppImage
        run: |
          app=$(ls linux/dist/Twincxt-*.AppImage)
          export TWINCXT_SMOKE=10 TWINCXT_DEBUG=1 TWINCXT_USERDATA="$RUNNER_TEMP/twincxt-ai" TWINCXT_UPDATE_DELAY=600 \
            APPIMAGE_EXTRACT_AND_RUN=1
          timeout 90 xvfb-run -a dbus-run-session -- "$app" > check/appimage.log 2>&1 || true
          tail -n 20 check/appimage.log
          grep -q 'shell: {"type":"ready"' "$RUNNER_TEMP/twincxt-ai/debug.log"

      - name: Checksums
        run: |
          cd linux/dist
          sha256sum Twincxt-*.AppImage Twincxt-*.deb > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
          ls -la

      - name: Upload the files
        uses: actions/upload-artifact@v4
        with:
          name: Twincxt-Linux
          path: |
            linux/dist/Twincxt-*.AppImage
            linux/dist/Twincxt-*.deb
            linux/dist/SHA256SUMS-linux.txt
          if-no-files-found: error

      - name: Upload the check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Twincxt-Linux-check
          path: check/
          if-no-files-found: ignore

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          tag="${RELEASE:-$GITHUB_REF_NAME}"
          case "$tag" in v[0-9]*) ;; *) echo "Not a version tag: $tag"; exit 1 ;; esac
          gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Twincxt ${tag#v}" --notes "" || true
          gh release upload "$tag" linux/dist/Twincxt-*.AppImage linux/dist/Twincxt-*.deb linux/dist/SHA256SUMS-linux.txt -R "$GITHUB_REPOSITORY" --clobber

  ubuntu-24:
    name: Install and start on Ubuntu 24.04
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Twincxt-Linux
          path: dist

      - name: Install the .deb (with what it recommends)
        timeout-minutes: 20
        run: |
          eval "$APT_RETRY"
          RECOMMENDS=1 apt_install "./$(ls dist/Twincxt-*.deb)" xvfb dbus-x11
          dpkg -l | grep -E 'twincxt|gstreamer1.0-(plugins-good|plugins-bad|libav|nice|pipewire)|ayatana-appindicator3' || true
          TWINCXT_SELFTEST=1 twincxt

      - name: Start it
        run: |
          mkdir -p check
          export TWINCXT_SMOKE=40 TWINCXT_DEBUG=1 TWINCXT_USERDATA="$RUNNER_TEMP/twincxt-data" \
            TWINCXT_SMOKE_SHOT="$PWD/check/linux-24.04.png" TWINCXT_UPDATE_DELAY=600
          timeout 150 xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- twincxt > check/app-24.04.log 2>&1 || echo "exit code $?"
          cp "$RUNNER_TEMP/twincxt-data/debug.log" check/debug-24.04.log || true
          grep '^SMOKE' check/app-24.04.log || true
          tail -n 40 check/app-24.04.log
          grep -q '^SMOKE done' check/app-24.04.log

      - name: Upload the check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Twincxt-Linux-check-24.04
          path: check/
          if-no-files-found: ignore
